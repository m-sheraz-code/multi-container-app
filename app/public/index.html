<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
       
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
       
        .container {
            background-color: white;
            border-radius: 3px 60px 3px 3px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            border: 2px solid  #ed1818;
            overflow: hidden;
        }
       
        .form-container {
            padding: 40px;
        }
       
        h2 {
            text-align: center;
            color: #ed1818;
            margin-bottom: 30px;
            font-size: 30px;
        }
       
        .form-group {
            margin-bottom: 20px;
        }
       
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
       
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
       
        input:focus {
            border-color: #ed1818;
            outline: none;
        }
       
        button {
            width: 100%;
            padding: 12px;
            background-color: #ed1818;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
       
        button:hover {
            background-color: #c82727;
        }
   
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-container">
            <h2>
                Welcome to our<br>Login Page
            </h2>
            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                    <div class="error-message" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error-message" id="passwordError"></div>
                </div>
                <button type="submit">Login Here</button>
                <div id="statusMessage" class="status-message"></div>
            </form>
        </div>
    </div>
    <script>
        // Modified frontend JavaScript for the login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Basic validation
            if (!username || !password) {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.textContent = 'Please enter both username and password';
                statusMessage.className = 'status-message error';
                statusMessage.style.display = 'block';
                return;
            }

            // Show loading message
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = 'Logging in...';
            statusMessage.className = 'status-message';
            statusMessage.style.display = 'block';

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log("Login response:", data);
                if (data.success) {
                    statusMessage.textContent = 'Login successful! Redirecting...';
                    statusMessage.className = 'status-message success';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 500);
                } else {
                    statusMessage.textContent = 'Invalid username or password';
                    statusMessage.className = 'status-message error';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                statusMessage.textContent = 'Error connecting to server';
                statusMessage.className = 'status-message error';
            });
        });
    </script>
</body>
</html>
